name: E-commerce
on:
  workflow_dispatch:
    inputs:
      env:
        description: "Select the target enviroment"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: "dev"
jobs:
  test:
    name: Run tesst on ${{ inputs.env }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Test with Selected Environment
        run: |
          echo "Target Env: ${{ inputs.env }}"
          npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
